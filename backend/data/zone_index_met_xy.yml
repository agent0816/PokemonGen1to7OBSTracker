# Zonen-Index -> met_location (XY), aus ROM extrahiert (2026-10-23)
# Quelle: Pokemon X (USA) (En,Ja,Fr,De,Es,It,Ko).3ds, GARC a/0/1/2, Zonedata = Datei 360, 360 Records a 56 Bytes
# met = (zonedata[rec*56+0x1C] & 0xFF) + 0x100 * (zonedata[rec*56+0x1D] & 1)
# Index = Zonedata-Recordnummer (0-basiert); zur Laufzeit wird gegen den
# encounter_zone_index-Pointer (u16) gelesen.
# Randomizer (UPR) aendert Encounter-Slots, nicht Zonedata-met -> Tabelle gilt
# auch fuer Rando-ROMs (Annahme, beim ersten Rando-Run per Log pruefen).

