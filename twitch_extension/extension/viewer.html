<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Tracker Overlay</title>
    <link rel="stylesheet" href="css/viewer.css">
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
</head>
<body>
    <div id="root" class="collapsed" aria-live="polite">
        <div id="status-bar">
            <span id="status-dot" class="dot dot-disconnected" title="Verbindung"></span>
            <span id="status-text">Warte auf Auth&hellip;</span>
        </div>
        <pre id="raw-state">(noch kein State)</pre>
        <div id="last-event">
            <div class="hdr">Letztes PubSub-Event</div>
            <pre id="last-event-body">(noch nichts empfangen)</pre>
        </div>
    </div>

    <script src="ebs-endpoint.js"></script>
    <script src="js/viewer.js"></script>
</body>
</html>
