# Gift/Fossil/Static/Egg Encounter-Definitionen für Gen 4
# Keyed by map_header_id (childMapHeader u16 via Pointer-Chain)
# dexnr wird NICHT geprüft — Randomizer ändert Species
#
# type: gift | fossil | egg | static | trade
# count: wie viele Pokemon an diesem Ort vergeben werden
# repeatable: true wenn mehrfach einlösbar
# edition: [41=D, 42=P, 43=Pt, 44=HG, 45=SS] — wenn leer, gilt für alle DPPt/HGSS
# condition: optionale Bedingung (event_transfer, post_game, national_dex)
#
# Map-Header-IDs aus NDS-Ironmon-Tracker LocationData.lua
# HINWEIS: IDs noch nicht gegen BizHawk verifiziert — bei Fehlern bitte melden

