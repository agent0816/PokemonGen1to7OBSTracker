# Gen 3 (GBA) — BizHawk-Pointer
# gameversion 31 = Rubin, 32 = Saphir, 33 = Smaragd, 34 = Feuerrot, 35 = Blattgrün
# badgepointer ist sprach-spezifisch (language-Wert aus ROM 0xAC)
# box_pointer zeigt auf den ersten Slot der ersten PC-Box im EWRAM.
# 14 Boxen je 30 Slots à 80 Bytes (= 2400 B), kein Padding zwischen Boxen.
# Box-Pointer & Strides per tools/find_pointers.py auf deutschen ROMs verifiziert.
#
# Smaragd / Feuerrot / Blattgrün-Sonderfall: gPokemonStoragePtr wird beim
# Spielstart in einen randomisierten EWRAM-Bereich relocated (Anti-Cheat).
# Statt eines festen box_pointer steht hier box_pointer_indirect (= feste
# IWRAM-Adresse des 4-Byte-LE-Pointers) plus box_pointer_offset (= u8
# currentBox + Padding, also 4 Bytes vor dem ersten Box-Slot). Verifiziert
# mit jeweils zwei Sessions via tools/find_storage_ptr.py:
#   Smaragd:    *0x03005D94 + 4 = Box-Basis
#   Feuerrot:   *0x03004F60 + 4 = Box-Basis
#   Blattgrün:  *0x03004F60 + 4 = Box-Basis (FR/BG teilen Code-Basis)
# Rubin/Saphir nutzen statische Pointer (keine Saveblock-Relocation).
#
# Bag-Pockets (slot_size = 4 B, u16 LE id + u16 LE qty):
# - Rubin/Saphir: statische bag_*-Adressen (kein Relocation).
# - Smaragd/FR/BG: bag_*_offset relativ zu *(box_pointer_indirect), gleicher
#   Indirect-Pointer wie boxen. Offsets sind signed (negativ = vor box_storage).
# - Smaragd/FR/BG: bag_qty_xor_encrypted=true bedeutet, dass qty-Bytes der Bag-
#   Pockets (bag_items/keyitems/baelle/tmvm/beeren) XOR-encrypted sind mit dem
#   Security-Key (16 bit, abgeleitet aus SaveBlock2). IDs sind klar lesbar.
#   bag_pc ist NICHT XOR-encrypted (Pokemon-Center-Storage ohne Anti-Cheat).
# Pocket-Sizes (R/S=20/20/16/64/46, E=30/30/16/64/46, FR-BG=42/30/13/58/43 slots).
# bag_pc: 50 Slots in allen Editionen.
# Pointer per tools/find_bag_ptr.py auf deutschen ROMs verifiziert.
#
# Encounter-Outcome-Check (Fix 2 + 3):
#   partycountpointer:          statische u8-Adresse der aktuellen Party-Groesse
#                               (gPlayerPartyCount). Verifiziert per Dump-Diff.
#   currentbox_pointer:         statische u8-Adresse der aktiven PC-Box (nur R/S).
#   currentbox_indirect_offset: bei E/FR/BG liegt currentBox relativ zum
#                               dereferenzierten box_pointer_indirect (Offset 0).
#                               Der Indirect-Pointer bewegt sich innerhalb einer
#                               Session — muss bei jedem Read neu dereferenziert
#                               werden.
31:
  pointer: 0x3004370
  box_pointer: 0x20300A4
  box_count: 14
  box_stride: 0x960
  mapheaderpointer: 0x0202E828
  battlerscountpointer: 0x02024A68
  # gBattleOutcome (u8): 0 = Kampf aktiv, sonst ended (1=won, 2=lost, 4=fled, 7=caught).
  # gBattlersCount alleine reicht NICHT — bleibt nach Kampfende non-zero und
  # macht die Battle-Detection stuck-true (Bug: keine Encounter mehr erkannt).
  # Adresse aus Ironmon-Tracker GameAddresses/Pokemon Ruby v1.0.json.
  # TODO: vor Release mit tools/find_pointers.py auf DE-Rubin verifizieren
  # (Session 2026-07-30, Ironmon-Cross-Check als Interim-Beleg).
  battleoutcomepointer: 0x02024D26
  # gBattleMons[0].species (u16): erste Species im Battle. In "no battle"
  # meist 0/garbage → als Sanity-Check für Fake-Battle-Filter.
  battlemonspointer: 0x02024A80
  # gBattleTypeFlags (u32): Bit 3 = BATTLE_TYPE_TRAINER. Verifiziert
  # 2026-08-02 auf DE-Rubin per verify_battletypeflags.lua (identisch zu
  # Ironmon-EN v1.0/1.1/1.2). Adresse ueberdeckt EN- und DE-ROMs.
  battletypeflagspointer: 0x020239F8
  battleopponentidpointer: 0x0202FF5E
  battleopponentpointer: 0x030045C0
  # gPlayerPartyCount (u8) — Outcome-Check nach Kampfende
  partycountpointer: 0x03004360
  # currentBox (u8) — statisch bei R/S, box_pointer - 4
  currentbox_pointer: 0x020300A0
