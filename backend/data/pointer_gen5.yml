# Gen 5 (NDS) — BizHawk-Pointer
# gameversion 51 = Schwarz, 52 = Weiß, 53 = Schwarz 2, 54 = Weiß 2
# Pointer auf deutschen ROMs getestet (Offsets weichen bei englischen Versionen ab)
#
# battleopponentpointer / battleopponentidpointer sind noch nicht in Benutzung,
# aber reserviert für zukünftige Features (Gegner-Team, Trainer-ID lesen).
# battleopponentidpointer: u_le_16; 0x0 = wildes Pokemon, > 0x0 = Trainer-ID
#
# box_pointer zeigt auf den ersten Slot der ersten PC-Box im ARM9-System-Bus.
# 24 Boxen je 30 Slots à 136 Bytes (= 4080 B), Stride 0x1000 (16 B Padding pro Box).
# Box-Pointer & Strides per tools/find_pointers.py auf deutschen ROMs verifiziert.
#
# bag_* zeigen auf den ersten Slot der jeweiligen Tasche-Pocket im ARM9-System-Bus.
# Slot-Format: u16 LE id + u16 LE qty = 4 B/Slot, leere Slots = 0x00000000.
# Pocket-Abstaende sind editionsinvariant:
#   Items -> KeyItems = 0x4D8, KeyItems -> TMVM = 0x14C,
#   TMVM  -> Medizin  = 0x1B4, Medizin  -> Beeren = 0xC0.
# bag_items liegt in allen Editionen genau 0x18000 nach box_pointer.
# Pointer per tools/find_bag_ptr.py auf deutschen ROMs verifiziert.
