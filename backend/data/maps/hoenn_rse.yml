# Hotspot-/Kalibrierungsdaten Regionskarte Hoenn (Kartenfeature)
# Geometrie aus pret-Decomp region_map_sections.json; Labels aus encounter_locations_gen3.yml (deutsch).
# Key = MAPSEC (= live regionMapSectionId, gMapHeader+0x14, = Encounter-Route-Key).
# x/y/width/height in Grid-Zellen (nativ 8 px). Phase 4: px_per_cell = Bildbreite / grid.cols.
# Labels = PKHeX gen3/text_rsefrlg_00000_de.txt[MAPSEC] (2026-10-28 neu gesetzt, alte
#   waren ab MAPSEC 51 um +1 verrutscht). pokemon: Quellen laut pret/pokeemerald+pokeruby
#   (wild_encounters.json + setwildbattle/givemon/Tausch in Map-Scripts); leer = nichts
#   fang-/erhaltbar. METEOR_FALLS2/FIERY_PATH2/JAGGED_PASS2 entfernt (von keiner Map genutzt).

region: hoenn
image: hoenn.png
# Bild 257x159 = echte In-Game RSE-Spielkarte (User-Screenshot Map_Hoenn.png).
#   Ersetzt den fruehren 224x120-Decomp-Crop, der unten + rechts abgeschnitten
#   war (komplette Suedsee/Eventura-Inseln fehlten). Der alte Crop war pixel-
#   identisch mit dem oberen-linken Ausschnitt des Screenshots (SAD=0), d.h. das
#   neue Bild ist der SELBE Inhalt nur rechts+unten erweitert.
# Offset (8,16) = decomp-Region-Map-Cursor-Origin (MAPCURSOR_X_MIN 1,
#   MAPCURSOR_Y_MIN 2) in px: In-Game-Karte zeichnet jede Section bei (x+1, y+2)
#   Zellen. An 7 Stadt-Markern vermessen (Residual ~0 statt vorher versetzt).
#   px = x*tile_px + x_offset / y*tile_px + y_offset.
grid: {cols: 28, rows: 15}
tile_px: 8
x_offset: 8
y_offset: 16
