# ============================================================
# ORAS — Wunderorte (Soaring-Legendäre, Post-Game)
# ============================================================
# Alle Soaring-Legendären erscheinen in Wunderorten (Mirage Spots).
# Die Zone-IDs sind unbekannt. Encounter-Locations:
#   326 = Wunderwald, 328 = Wunderhöhle, 330 = Wundereiland,
#   332 = Wunderberg
#
# Legendäre:
# - Ho-Oh (OR) / Lugia (AS) — Wundereiland (bei Seewoge Malvenfroh)
# - Dialga (OR) / Palkia (AS) — Wunderhöhle
# - Reshiram (OR) / Zekrom (AS) — Wunderberg
# - Giratina — Wunderhöhle (braucht Dialga + Palkia)
# - Kyurem — Wunderhöhle (braucht Reshiram + Zekrom)
# - Heatran — Wunderhöhle (Kampfresort-Nähe)
# - Tornadus (OR) / Thundurus (AS) — Wunderwolke
# - Landorus — Wunderwolke (braucht Tornadus + Thundurus)
# - Raikou (OR) / Entei (AS) — Wilder Wald
# - Suicune — Wilder Wald (braucht Raikou + Entei)
# - Uxie, Mesprit, Azelf — Namenlose Ebene
# - Cobalion, Terrakion, Virizion — Sichelinsel
# - Cresselia — Sichelinsel
#
# TODO: Zone-IDs für Wunderorte mit zone_logger.py ermitteln.
#       Jeder Wunderort-Typ hat vermutlich eine eigene zone_id.
