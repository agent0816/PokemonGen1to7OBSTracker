# Hotspot-Daten Regionskarte Johto + Kanto (HGSS, Kartenfeature).
# Key = MAPSEC = met_location (pret/pokeheartgold include/constants/map_sections.h;
#   == PKHeX gen4/text_hgss_00000_de.txt-Index, z.B. 126 Neuborkia, 177 Route 29).
# Bild johto_kanto.png (362x145) = echte In-Game HGSS-Pokegear-Karte Johto+Kanto
#   (User-Screenshot Map_Kanto-Johto.png).
# Geometrie: Pokegear-Tabelle sLocationSpecs (src/application/pokegear/map/
#   pokegear_map.c: x/y/width/height in 8px-Tiles). Orte ohne eigenen Eintrag
#   (Dungeons/Innenraeume) ueber map_headers.h worldMapX/worldMapY, die im selben
#   Raster liegen, nur y um 2 versetzt (Glockenturm 7->9, Einheitstunnel 13->15).
#   Pixel = x*8-7 / y*8-8 (Offset am Overlay gefittet + visuell geprueft) -> px_rects.
# Labels = PKHeX gen4 DE. pokemon: Quellen laut pokeheartgold (gs_enc_data.json via
#   wildEncounterBank; WildBattle/GiveMon/GiveEgg/ChooseStarter/NPCTradeExec in den
#   Map-Scripts). Live-Position fuer HGSS steht noch aus (player x/y-Offsets).
