# Hotspot-/Kalibrierungsdaten Regionskarte Kanto (Kartenfeature)
# Geometrie aus pret-Decomp region_map_sections.json; Labels aus encounter_locations_gen3.yml (deutsch).
# Key = MAPSEC (= live regionMapSectionId, gMapHeader+0x14, = Encounter-Route-Key).
# x/y/width/height in Grid-Zellen (nativ 8 px). Phase 4: px_per_cell = Bildbreite / grid.cols.
# Dungeons (126-142) stehen im Decomp mit x/y 0 -> Positionen aus pokefirered
#   src/data/region_map/region_map_layout_kanto.h [LAYER_DUNGEON] (selber Grid-Raum wie x/y)
#   als cells-Liste. Ohne eigenes Kartenfeld im Spiel -> Zellen der Stadt/Route (MAP-Layer):
#   S.S. Anne=Orania, Rocket-Versteck=Prismania, Silph=Saffronia, Liga=Indigo-Plateau,
#   Tunnelpfade=Route 5+6 bzw. 7+8. Ueberlappende Zellen -> Sammel-Legende im MapMenu.
# pokemon: Quellen laut pret/pokefirered (wild_encounters.json + setwildbattle/givemon/
#   Tausch in Map-Scripts); leer = nichts fang-/erhaltbar.

region: kanto
image: kanto.png
# Bild 192x144 = echte In-Game FRLG-Spielkarte (User-Screenshot FRBG_integrierte_
#   Spielkarte_(Kanto).png). Ersetzt den fruehren 160x128-Decomp-Crop, der rechts
#   + unten abgeschnitten war (Zinnoberinsel/Suedsee fehlten).
# Der alte Crop sitzt pixelgenau im oberen-linken Ausschnitt des Screenshots
#   (Kuesten/Routen 1:1 deckungsgleich bei (0,0); via Raw-/Edge-/Land-Masken-Match
#   bestaetigt) -> neues Bild = SELBER Inhalt nur rechts+unten erweitert.
# Offset (8,16) = decomp-Region-Map-Cursor-Origin (MAPCURSOR_X_MIN 1,
#   MAPCURSOR_Y_MIN 2) in px: die In-Game-Karte zeichnet jede Section bei
#   (x+1, y+2) Zellen. An 7/7 Stadt-Markern vermessen (dx+8 dy+16, Residual 0).
#   px = x*tile_px + x_offset / y*tile_px + y_offset.
grid: {cols: 20, rows: 16}
tile_px: 8
x_offset: 8
y_offset: 16
