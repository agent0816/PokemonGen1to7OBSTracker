# Soullink-Regel-Presets. NuzlockeMenu läst sie über backend/soullink_presets.py
# und wendet die Rule-Keys direkt auf das nuzlocke.yml-Dict an (flach, rule_*).

standard_nuzlocke:
  label: "Standard Nuzlocke (ohne Soullink)"
  description: >
    Klassisches Nuzlocke ohne Verlinkung: erster Encounter pro Route,
    Tod ist endgültig, Nickname-Pflicht. Dupes-Retry + Shiny-Clause aktiv,
    keine Token-/Ersttyp-Regeln (entspricht Standard 2-Way ohne Soullink).
  run_mode: nuzlocke
  rules:
    rule_run_start_on_ball: true
    rule_dead_pokemon_unusable: true
    rule_one_encounter_per_area: true
    rule_must_catch_first_encounter: true
    rule_nickname_required: true
    rule_species_clause_cross_players: false
    rule_same_species_retry: true
    rule_token_rule: false
    rule_shiny_clause_always_catchable: true
    rule_restart_on_total_wipe: true

standard_2way:
  label: "Standard 2-Way Soullink"
  description: >
    Basis-Soullink 2 Spieler mit Dupes-Retry + Token-Regel. Kein Ersttyp-Clause.
  run_mode: coop
  soullink_player_count: 2
  soullink_link_strategy: full_chain
  rules:
    rule_run_start_on_ball: true
    rule_dead_pokemon_unusable: true
    rule_one_encounter_per_area: true
    rule_must_catch_first_encounter: true
    rule_nickname_required: true
    rule_species_clause_cross_players: false
    rule_same_species_retry: true
    rule_token_rule: true
    rule_shiny_clause_always_catchable: true
    rule_restart_on_total_wipe: true

versus_2v2:
  label: "2v2 Versus"
  description: >
    Zwei Zweierteams mit internem Soullink. Ersttyp-Clause zwischen Partnern,
    Static-Ausnahme, ein Ersttyp pro Team.
  run_mode: versus
  soullink_player_count: 4
  soullink_link_strategy: full_chain
  rules:
    rule_run_start_on_ball: true
    rule_dead_pokemon_unusable: true
    rule_restart_on_total_wipe: true
    rule_one_encounter_per_area: true
    rule_must_catch_first_encounter: true
    rule_nickname_required: true
    rule_first_type_clause_linked: true
    rule_first_type_clause_static_exception: true
    rule_single_type_per_team: true
    rule_shiny_clause_always_catchable: true
    rule_same_species_retry: false
    rule_token_rule: false

versus_ffa:
  label: "Versus – Jeder gegen jeden"
  description: >
    Unabhängige Nuzlocke-Runs im Wettkampf: kein Soullink, keine Links.
    Scoreboard (Orden, lebende Pokemon, Tode) pro Spieler statt pro Team.
    Standard-Nuzlocke-Regeln, Total-Wipe scheidet aus.
  run_mode: versus_ffa
  rules:
    rule_run_start_on_ball: true
    rule_dead_pokemon_unusable: true
    rule_restart_on_total_wipe: true
    rule_one_encounter_per_area: true
    rule_must_catch_first_encounter: true
    rule_nickname_required: true
    rule_species_clause_cross_players: false
    rule_same_species_retry: true
    rule_token_rule: false
    rule_first_type_clause_linked: false
    rule_shiny_clause_always_catchable: true

coop_3way:
  label: "3-Way Coop"
  description: >
    Drei Spieler, alle miteinander verlinkt. Ersttyp-Clause + Static-Ausnahme.
    Ein Ersttyp pro Team.
  run_mode: coop
  soullink_player_count: 3
  soullink_link_strategy: full_chain
  rules:
    rule_run_start_on_ball: true
    rule_dead_pokemon_unusable: true
    rule_restart_on_total_wipe: true
    rule_one_encounter_per_area: true
    rule_must_catch_first_encounter: true
    rule_nickname_required: true
    rule_first_type_clause_linked: true
    rule_first_type_clause_static_exception: true
    rule_single_type_per_team: true
    rule_shiny_clause_always_catchable: true
    rule_same_species_retry: false
    rule_token_rule: false

coop_4way_usum:
  label: "4-Way Coop (Drachenwut)"
  description: >
    Vier Spieler, alle verlinkt. Ersttyp-Clause ohne Static-Ausnahme,
    Drachenwut-Klausel bis Orden 2, Shiny immer fangbar.
  run_mode: coop
  soullink_player_count: 4
  soullink_link_strategy: full_chain
  rules:
    rule_run_start_on_ball: true
    rule_dead_pokemon_unusable: true
    rule_restart_on_total_wipe: true
    rule_one_encounter_per_area: true
    rule_must_catch_first_encounter: true
    rule_nickname_required: true
    rule_first_type_clause_linked: true
    rule_first_type_clause_static_exception: false
    rule_single_type_per_team: false
    rule_dragon_rage_clause: true
    rule_dragon_rage_clause_badge_limit: 2
    rule_shiny_clause_always_catchable: true
    rule_same_species_retry: false
    rule_token_rule: false

coop_4way_gen3:
  label: "4-Way Coop"
  description: >
    Vier Spieler, alle verlinkt. Ersttyp-Clause + Static-Ausnahme, ein
    Ersttyp pro Team, Shiny-Clause, Restart bei Total-Wipe. Ohne Doppelkampf-,
    Drachenwut- und Moveset-Regeln.
  run_mode: coop
  soullink_player_count: 4
  soullink_link_strategy: full_chain
  rules:
    rule_run_start_on_ball: true
    rule_dead_pokemon_unusable: true
    rule_restart_on_total_wipe: true
    rule_one_encounter_per_area: true
    rule_must_catch_first_encounter: true
    rule_nickname_required: true
    rule_first_type_clause_linked: true
    rule_first_type_clause_static_exception: true
    rule_single_type_per_team: true
    rule_shiny_clause_always_catchable: true
    rule_same_species_retry: false
    rule_token_rule: false
