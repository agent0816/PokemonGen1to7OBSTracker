# Gift/Fossil/Static/Egg Encounter-Definitionen für Gen 5
# Keyed by map_header_id (childMapHeader u16 Wert aus mapidpointer)
# dexnr wird NICHT geprüft — Randomizer ändert Species
#
# type: gift | fossil | egg | static | trade
# count: wie viele Pokemon an diesem Ort vergeben werden
# repeatable: true wenn mehrfach einlösbar (z.B. tägliches Fossil)
# edition: [51,52,53,54] — wenn leer, gilt für alle
# condition: optionale Bedingung (event_transfer, post_game, national_dex)
#
# Map-Header-IDs verifiziert gegen NDS-Nuzlocke-Tracker (LocationData.lua)

