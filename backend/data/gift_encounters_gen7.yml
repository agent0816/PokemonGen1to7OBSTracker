# Gift/Fossil/Static/One-Time Encounter-Definitionen für Gen 7
# Keyed by zone_id (u16, Runtime-Wert aus encounter_zone_pointer)
# dexnr wird NICHT geprüft — Randomizer ändert Species
#
# type: gift | fossil | egg | static | trade | one-time
# count: wie viele Pokemon an diesem Ort vergeben werden
# repeatable: true wenn mehrfach einlösbar
# edition: [71=Sonne, 72=Mond, 73=Ultra Sonne, 74=Ultra Mond]
# condition: optionale Bedingung (post_game, event)
#
# HINWEIS: encounter_zone_pointer für Gen 7 noch NICHT gefunden!
#          Alle zone_ids müssen empirisch per zone_logger.py ermittelt werden.
#          Bis dahin sind die Einträge als TODOs mit ???: auskommentiert.
#          met_location_ids aus encounter_locations_gen7.yml als Referenz.
#
# Quelle: tools/research/gen7/nuzlocke-usum-data/encounters.json
#         + Recherche-Agent SM-Delta-Ergebnis (2026-07-05)

