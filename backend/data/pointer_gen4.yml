# Gen 4 (NDS) — BizHawk-Pointer
# gameversion 41/42 = Diamant/Perl, 43 = Platin, 44 = HeartGold, 45 = SoulSilver
# Pointer auf deutschen ROMs getestet
#
# battleopponentpointer / battleopponentidpointer sind noch nicht in Benutzung,
# aber reserviert für zukünftige Features (Gegner-Team, Trainer-ID lesen).
# battleopponentidpointer: u_le_16; 0x0 = wildes Pokemon, > 0x0 = Trainer-ID
#
# box_pointer zeigt auf den ersten Slot der ersten PC-Box im Main RAM (NDS).
# 18 Boxen je 30 Slots à 136 Bytes (= 4080 B). Stride:
#   - DPPt (41/42/43): 0xFF0  (kontinuierlich, kein Padding)
#   - HG/SS (44/45):    0x1000 (16 B Padding pro Box)
# Box-Pointer & Strides per tools/find_pointers.py auf deutschen ROMs verifiziert.
#
# bag_* zeigen auf den ersten Slot der jeweiligen Tasche-Pocket im Main RAM.
# Slot-Format: u16 LE id + u16 LE qty = 4 B/Slot, leere Slots = 0x00000000.
# bag_mailitems: 12 Slots à 4 B (id+qty). Die Mail-Body-Daten (Sender, Text)
# liegen separat in einem anderen SaveBlock-Bereich und sind hier nicht erfasst.
# Pointer per tools/find_bag_ptr.py auf deutschen ROMs verifiziert.
