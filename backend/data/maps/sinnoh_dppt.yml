# Hotspot-/Kalibrierungsdaten Regionskarte Sinnoh (Kartenfeature, DPPt).
# Geometrie aus pret/pokeplatinum res/town_map/town_map_data.json (blocks).
# Key = Section = met_location = LocationNames-Index (= encounter_locations_gen4.yml-Key,
#       = DB-route). area-Name normalisiert; eternia->Eterna, mount_coronet->MtCoronet.
# Bild sinnoh.png (216x168) = echte In-Game DPPt-Integrierte-Spielkarte (User-
#   Screenshot). Das ist der decomp-Koordinatenraum (256x192 TOWN_MAP_GRID) links
#   um 19px + unten um 24px gecroppt -> Transform ggü. decomp ist PURE Translation
#   (x -19, y gleich; an 8 Städten verifiziert: Sonnewik 210->191, Herzhofen
#   126->107, Weideburg 154->135 usw.). Der Roh-Decomp-Render traf den In-Game-
#   Look nicht (Extended-Palettes, nur 32 Decomp-Farben) -> echtes In-Game-Bild.
# Transform Zelle->Pixel: px = x*tile_px + x_offset, py = z*tile_px + y_offset
#   (TOWN_MAP_GRID spacing 7; x_offset 1, y_offset -38). Per Offset-Suche
#   kalibriert: Anteil Routen-/Stadt-Pixel (orange/rot/blau) unter allen Zellen
#   maximiert -> (1,-38) ~74 % vs. alt (6,-36) ~49 % (Hotspots sassen ~5px zu
#   weit rechts, ~2px zu tief = "nach Suedosten"). Visuell am Overlay ueber die
#   ganze Karte gegengeprueft (Staedte 2x2, Routen, Hoehlen). Gen 3 nutzt
#   ebenfalls Offset (Cursor-Origin 8,16).
# cells = Liste [x,z] aller Town-Map-Blocks der Section (Routen = mehrere Zellen).
# Labels deutsch = PKHeX gen4/text_hgss_00000_de.txt[met] (2026-10-28 neu gesetzt; das
#   alte encounter_locations_gen4.yml war ab met 46 um +1 verrutscht).
# Zusatz-Hotspots ohne eigene Area (Dungeons/Seen/Landmarks) aus town_map_data.json
#   'landmark'-Bloecken bzw. der Ufer-Area: Seen 76-78 = Ufer-Zellen 72-74, Scheidequelle =
#   Fruehlingspfad, Maniac-Tunnel = Maniac-Hoehle, Trophaeengarten = Villa-Landmark,
#   Zerrwelt = Hoehle der Umkehr. Ueberlappende Zellen -> Sammel-Legende im MapMenu.
# pokemon: Quellen laut pret/pokeplatinum (wild = map_headers wildEncountersArchiveID,
#   static/gift/trade = Field-Scripts); leer = dort nichts fang-/erhaltbar. Nur Platin geprueft.
# px_rects (native Bildpixel) ueberschreibt cells: Voll-/Neumondinsel auf die Inseln NO
#   der Eiseninsel (West = Vollmond, Ost = Neumond, Reihenfolge wie Decomp x 1 < 4).
# Layout aus PLATIN; D/P teilen dasselbe Sinnoh-Layout (games-Feld pro Eintrag aus
# encounter-yml, sonst [41,42,43]) — DP nicht gegengeprueft (Schritt F).
