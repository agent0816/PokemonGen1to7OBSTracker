# Gift/Fossil/Static/Egg Encounter-Definitionen für Gen 6
# Keyed by Zonen-Index (u16 aus encounter_zone_index = Zonedata-Recordnummer)
# dexnr wird NICHT geprüft — Randomizer ändert Species
#
# type: gift | fossil | egg | static | trade
# count: wie viele Pokemon an diesem Ort vergeben werden
# repeatable: true wenn mehrfach einlösbar
# edition: [61=X, 62=Y, 63=OR, 64=AS] — wenn leer, gilt für alle XY bzw. ORAS
# condition: optionale Bedingung (event_transfer, post_game)
#
# Zonen-Indizes per Monitor-Tool (zone_logger.py --index-monitor) ermitteln
# (nur Runtime-verifizierte Werte verwenden!)
# HINWEIS: Indizes noch nicht verifiziert — mit dem Monitor-Tool beim
#          Spielen ermitteln und hier eintragen.

