# Gift/Fossil/Static/Egg Encounter-Definitionen für Gen 3
# Keyed by mapLayoutId (u16 aus gMapHeader+0x12)
# dexnr wird NICHT geprüft — Randomizer ändert Species
#
# type: gift | fossil | egg | static | trade
# count: wie viele Pokemon an diesem Ort vergeben werden
# repeatable: true wenn mehrfach einlösbar
# edition: [31=Rubin, 32=Saphir, 33=Smaragd, 34=Feuerrot, 35=Blattgrün]
# condition: optionale Bedingung (event_transfer, post_game)
#
# RSE-IDs auf Emerald-Basis normalisiert (R/S mapLayoutId > 107 wird
# in Python um -1 korrigiert, da R/S LILYCOVE_EMPTY_MAP bei 108 hat).
# FRLG-IDs direkt aus Ironmon RouteData.lua.
#
# mapLayoutIds aus Ironmon-Tracker RouteData.lua (setupRouteInfoAsRSE/FRLG)
# HINWEIS: Einige Locations fehlen in Ironmon (markiert als TODO)

